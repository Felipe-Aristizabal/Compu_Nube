defaults
   timeout connect 5s
   timeout client 1m
   timeout server 1m

frontend stats
   bind *:1936
   mode http
   stats uri /
   stats show-legends
   no log

frontend http_front
   bind *:80
   mode http
   default_backend http_back

backend http_back
   mode http
   balance roundrobin
   default-server inter 3s fall 3 rise 2
   server-template mywebapp 1-2 _web._tcp.service.consul resolvers consul resolve-opts allow-dup-ip resolve-prefer ipv4 check
   errorfile 503 /etc/haproxy/errors/web_down.http

resolvers consul
   nameserver consul 127.0.0.1:8600
   accepted_payload_size 8192
   hold valid 5s
